<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitación de Cumpleaños - Rebeca</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: #fff;
      overflow: hidden;
      position: relative;
      background: radial-gradient(circle at top, #003c7a, #000814);
    }

    /* Fondo dinámico: siguiente foto + degradado */
    .bg-dynamic {
      position: fixed;
      inset: 0;
      z-index: -3;
      background-size: cover;
      background-position: center;
      filter: blur(12px) brightness(0.6);
      transform: scale(1.08);
      transition: background-image 0.8s ease-out;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: radial-gradient(circle at top, rgba(255,255,255,0.08), rgba(0,0,0,0.82));
    }

    /* Globos que suben */
    .balloon {
      position: fixed;
      bottom: -120px;
      width: 36px;
      height: 48px;
      border-radius: 50% 50% 45% 45%;
      background: radial-gradient(circle at 30% 20%, #fff, #ff6bcb);
      box-shadow: 0 8px 16px rgba(0,0,0,0.35);
      animation: floatUp 10s linear infinite;
      z-index: -1;
    }
    .balloon::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 40px;
      background: rgba(255,255,255,0.8);
      left: 50%;
      top: 48px;
      transform: translateX(-50%);
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) translateX(0);   opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-120vh) translateX(30px); opacity: 0; }
    }

    /* Escena 3D */
    .scene {
      perspective: 1100px;
      width: 100%;
      max-width: 420px;
    }

    .card {
      position: relative;
      width: 100%;
      background: rgba(2, 10, 40, 0.9);
      border-radius: 24px;
      padding: 22px 18px 26px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.18);
      transform-style: preserve-3d;
      animation: cardFloat 10s ease-in-out infinite alternate;
    }
    @keyframes cardFloat {
      0%   { transform: rotateY(-8deg) rotateX(6deg) translateY(0); }
      50%  { transform: rotateY(8deg)  rotateX(-4deg) translateY(-6px); }
      100% { transform: rotateY(0deg)  rotateX(3deg)  translateY(0); }
    }

    .title {
      font-size: 1.6rem;
      margin: 0 0 10px;
      color: #ffdf6b;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0 0 14px;
      font-size: 1.02rem;
      color: #e5ecff;
    }
    .subtitle strong {
      color: #ff8af2;
    }

    /* Marco decorativo que cambia según la foto */
    .photo-frame {
      margin: 0 auto 16px;
      padding: 8px;
      border-radius: 22px;
      display: inline-block;
      position: relative;
      transition: background 0.5s ease, box-shadow 0.5s ease, border 0.5s ease;
    }
    .photo-frame::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 26px;
      border: 2px dashed rgba(255,255,255,0.3);
      pointer-events: none;
    }

    /* Paletas para cada foto (marco de globos/colores) */
    .frame-0 { background: linear-gradient(135deg, #ff8af2, #ffe66d); box-shadow: 0 0 18px rgba(255,138,242,0.7); }
    .frame-1 { background: linear-gradient(135deg, #6af0ff, #6b73ff); box-shadow: 0 0 18px rgba(107,115,255,0.7); }
    .frame-2 { background: linear-gradient(135deg, #ff9a9e, #fecfef); box-shadow: 0 0 18px rgba(255,154,158,0.7); }
    .frame-3 { background: linear-gradient(135deg, #9bffb8, #42e695); box-shadow: 0 0 18px rgba(66,230,149,0.7); }
    .frame-4 { background: linear-gradient(135deg, #ffd26f, #f29263); box-shadow: 0 0 18px rgba(242,146,99,0.7); }
    .frame-5 { background: linear-gradient(135deg, #c3cfe2, #fdeff9); box-shadow: 0 0 18px rgba(195,207,226,0.7); }
    .frame-6 { background: linear-gradient(135deg, #ffecd2, #fcb69f); box-shadow: 0 0 18px rgba(252,182,159,0.7); }
    .frame-7 { background: linear-gradient(135deg, #f6d365, #fda085); box-shadow: 0 0 18px rgba(246,211,101,0.7); }
    .frame-8 { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); box-shadow: 0 0 18px rgba(161,196,253,0.7); }
    .frame-9 { background: linear-gradient(135deg, #ff9a9e, #fecfef); box-shadow: 0 0 18px rgba(255,154,158,0.7); }
