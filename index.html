<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitación de Cumpleaños - Rebeca</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: #fff;
      overflow: hidden;
      position: relative;
      background: radial-gradient(circle at top, #003c7a, #000814);
    }

    /* Fondo dinámico: siguiente foto + degradado */
    .bg-dynamic {
      position: fixed;
      inset: 0;
      z-index: -3;
      background-size: cover;
      background-position: center;
      filter: blur(12px) brightness(0.6);
      transform: scale(1.08);
      transition: background-image 0.8s ease-out;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: radial-gradient(circle at top, rgba(255,255,255,0.08), rgba(0,0,0,0.82));
    }

    /* Globos que suben */
    .balloon {
      position: fixed;
      bottom: -120px;
      width: 36px;
      height: 48px;
      border-radius: 50% 50% 45% 45%;
      background: radial-gradient(circle at 30% 20%, #fff, #ff6bcb);
      box-shadow: 0 8px 16px rgba(0,0,0,0.35);
      animation: floatUp 10s linear infinite;
      z-index: -1;
    }
    .balloon::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 40px;
      background: rgba(255,255,255,0.8);
      left: 50%;
      top: 48px;
      transform: translateX(-50%);
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) translateX(0);   opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-120vh) translateX(30px); opacity: 0; }
    }

    /* Escena 3D para la card */
    .scene {
      perspective: 1100px;
      width: 100%;
      max-width: 420px;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .scene-hidden {
      opacity: 0;
      transform: translateY(20px) scale(0.96);
      pointer-events: none;
    }

    .card {
      position: relative;
      width: 100%;
      background: rgba(2, 10, 40, 0.9);
      border-radius: 24px;
      padding: 22px 18px 26px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.18);
      transform-style: preserve-3d;
      animation: cardFloat 10s ease-in-out infinite alternate;
    }
    @keyframes cardFloat {
      0%   { transform: rotateY(-8deg) rotateX(6deg) translateY(0); }
      50%  { transform: rotateY(8deg)  rotateX(-4deg) translateY(-6px); }
      100% { transform: rotateY(0deg)  rotateX(3deg)  translateY(0); }
    }

    .title {
      font-size: 1.6rem;
      margin: 0 0 10px;
      color: #ffdf6b;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    /* Marco decorativo que cambia según la foto */
    .photo-frame {
      margin: 0 auto 16px;
      padding: 8px;
      border-radius: 22px;
      display: inline-block;
      position: relative;
      transition: background 0.5s ease, box-shadow 0.5s ease, border 0.5s ease;
    }
    .photo-frame::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 26px;
      border: 2px dashed rgba(255,255,255,0.3);
      pointer-events: none;
    }

    .frame-0 { background: linear-gradient(135deg, #ff8af2, #ffe66d); box-shadow: 0 0 18px rgba(255,138,242,0.7); }
    .frame-1 { background: linear-gradient(135deg, #6af0ff, #6b73ff); box-shadow: 0 0 18px rgba(107,115,255,0.7); }
    .frame-2 { background: linear-gradient(135deg, #ff9a9e, #fecfef); box-shadow: 0 0 18px rgba(255,154,158,0.7); }
    .frame-3 { background: linear-gradient(135deg, #9bffb8, #42e695); box-shadow: 0 0 18px rgba(66,230,149,0.7); }
    .frame-4 { background: linear-gradient(135deg, #ffd26f, #f29263); box-shadow: 0 0 18px rgba(242,146,99,0.7); }
    .frame-5 { background: linear-gradient(135deg, #c3cfe2, #fdeff9); box-shadow: 0 0 18px rgba(195,207,226,0.7); }
    .frame-6 { background: linear-gradient(135deg, #ffecd2, #fcb69f); box-shadow: 0 0 18px rgba(252,182,159,0.7); }
    .frame-7 { background: linear-gradient(135deg, #f6d365, #fda085); box-shadow: 0 0 18px rgba(246,211,101,0.7); }
    .frame-8 { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); box-shadow: 0 0 18px rgba(161,196,253,0.7); }
    .frame-9 { background: linear-gradient(135deg, #ff9a9e, #fecfef); box-shadow: 0 0 18px rgba(255,154,158,0.7); }

    #fotoCumple {
      border-radius: 18px;
      border: 3px solid rgba(255,255,255,0.95);
      box-shadow: 0 8px 20px rgba(0,0,0,0.45);
      width: auto;
      height: auto;
      max-width: min(100%, 340px);
      max-height: 45vh;
      object-fit: contain;
      transition: width 0.2s ease, height 0.2s ease, opacity 0.3s ease;
      background: #0003;
    }

    .details {
      font-size: 0.96rem;
      color: #e0e7ff;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .details strong {
      color: #ffdf6b;
    }

    .btn-confirm {
      display: inline-block;
      width: 100%;
      max-width: 260px;
      padding: 12px 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffdf6b, #ff914d);
      color: #1c2541;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(1);   box-shadow: 0 10px 24px rgba(0,0,0,0.45); }
      50%  { transform: scale(1.03); box-shadow: 0 12px 26px rgba(255,223,107,0.6); }
      100% { transform: scale(1);   box-shadow: 0 10px 24px rgba(0,0,0,0.45); }
    }

    .confetti-piece {
      position: fixed;
      width: 8px;
      height: 14px;
      background: red;
      top: -20px;
      opacity: 0;
      z-index: 9999;
      animation: confettiFall 2.4s linear forwards;
    }
    @keyframes confettiFall {
      0%   { opacity: 1; transform: translateY(0) rotateZ(0deg); }
      100% { opacity: 0; transform: translateY(120vh) rotateZ(360deg); }
    }

    /* Música oculta, autoplay */
    audio {
      display: none;
    }

    /* SOBRE INICIAL SENCILLO */
    .intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, rgba(0,0,40,0.95), rgba(0,0,0,0.98));
      cursor: pointer;
      transition: opacity 0.6s ease;
    }
    .intro-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .envelope-simple {
      width: 220px;
      height: 150px;
      background: #ffffff;
      border: 3px solid #d0d0d0;
      border-radius: 10px;
      position: relative;
      box-shadow: 0 10px 26px rgba(0,0,0,0.7);
    }

    .envelope-simple::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60%;
      background: #e0e0e0;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-bottom: 1px solid #d0d0d0;
    }

    .intro-text {
      margin-top: 18px;
      font-size: 1.1rem;
      color: #f5f5ff;
      text-align: center;
    }

    @media (max-width: 480px) {
      .card {
        padding: 18px 14px 22px;
      }
      .title {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <!-- Fondo dinámico + overlay -->
  <div class="bg-dynamic" id="bgDynamic"></div>
  <div class="bg-overlay"></div>

  <!-- Pantalla inicial con sobre sencillo y texto -->
  <div id="intro" class="intro-overlay">
    <div class="envelope-simple"></div>
    <p class="intro-text">Abre para más información 😉</p>
  </div>

  <!-- Tarjeta 3D (inicia oculta) -->
  <div id="scene" class="scene scene-hidden">
    <div class="card">
      <h1 class="title">
        Estas invitado a esta gran celebración para Rebeca Abiagil Mendez Mendez para celebrarle sus 25 Añostes.
      </h1>

      <div id="photoFrame" class="photo-frame frame-0">
        <img id="fotoCumple" src="foto1.jpg" alt="Foto de Rebeca" />
      </div>

      <p class="details">
        Te invito a celebrar conmigo este día especial 🎉<br>
        <strong>Fecha:</strong> Domingo 14 de diciembre<br>
        <strong>Hora:</strong> De 4 de la tarde hasta que el cuerpo aguante
      </p>

      <button id="btnConfirm" class="btn-confirm">
        Confirmar asistencia
      </button>
    </div>
  </div>

  <!-- Música (sin icono, autoplay + loop) -->
  <audio id="music" src="musica.mp3" autoplay loop></audio>

  <script>
    // Globos dinámicos
    function crearGlobos() {
      for (let i = 0; i < 12; i++) {
        const b = document.createElement("div");
        b.classList.add("balloon");
        const delay = Math.random() * 8;
        const left = Math.random() * 100;
        const hue = Math.floor(Math.random() * 360);

        b.style.left = left + "vw";
        b.style.animationDelay = delay + "s";
        b.style.background = "radial-gradient(circle at 30% 20%, #fff, hsl(" + hue + ", 80%, 60%))";
        document.body.appendChild(b);
      }
    }
    crearGlobos();

    // Intro: sobre sencillo -> muestra invitación
    const intro  = document.getElementById("intro");
    const scene  = document.getElementById("scene");
    const music  = document.getElementById("music");

    function abrirInvitacion() {
      // Intentar reproducir música al hacer click
      if (music && music.paused) {
        music.play().catch(() => {});
      }

      // Ocultar sobre y mostrar invitación
      intro.classList.add("intro-hidden");
      setTimeout(() => {
        scene.classList.remove("scene-hidden");
      }, 400);
    }

    intro.addEventListener("click", abrirInvitacion);

    // Carrusel de fotos
    const fotos = [
      "foto1.jpg",
      "foto2.jpg",
      "foto3.jpg",
      "foto4.jpg",
      "foto5.jpg",
      "foto6.jpg",
      "foto7.jpg",
      "foto8.jpg",
      "foto9.jpg",
      "foto10.jpg"
    ];

    const foto  = document.getElementById("fotoCumple");
    const frame = document.getElementById("photoFrame");
    const bg    = document.getElementById("bgDynamic");
    let indice  = 0;

    function mostrarFotoActual() {
      const rutaActual = fotos[indice];
      const siguienteIndice = (indice + 1) % fotos.length;
      const rutaSiguiente = fotos[siguienteIndice];

      const nuevaImg = new Image();
      nuevaImg.src = rutaActual;

      nuevaImg.onload = function () {
        const maxAncho = Math.min(window.innerWidth * 0.9, 340);
        const maxAlto = window.innerHeight * 0.45;

        let ancho = nuevaImg.width;
        let alto  = nuevaImg.height;

        const ratio = Math.min(maxAncho / ancho, maxAlto / alto, 1);

        ancho = ancho * ratio;
        alto  = alto * ratio;

        foto.style.width  = ancho + "px";
        foto.style.height = alto + "px";
        foto.src = rutaActual;
      };

      frame.className = "photo-frame frame-" + (indice % 10);

      bg.style.backgroundImage =
        "linear-gradient(135deg, rgba(0,0,40,0.9), rgba(0,0,0,0.9)), url('" +
        rutaSiguiente +
        "')";
    }

    function cambiarFoto() {
      indice = (indice + 1) % fotos.length;
      mostrarFotoActual();
    }

    mostrarFotoActual();
    setInterval(cambiarFoto, 5000);

    // Confeti al confirmar
    function lanzarConfeti() {
      const colores = ["#ff4f7d", "#ffdf6b", "#6af0ff", "#9bffb8", "#ffffff"];
      const cantidad = 160;

      for (let i = 0; i < cantidad; i++) {
        const c = document.createElement("div");
        c.classList.add("confetti-piece");

        const size  = 6 + Math.random() * 6;
        const left  = Math.random() * 100;
        const delay = Math.random() * 0.8;
        const color = colores[Math.floor(Math.random() * colores.length)];

        c.style.width           = size + "px";
        c.style.height          = (size * 1.5) + "px";
        c.style.left            = left + "vw";
        c.style.background      = color;
        c.style.animationDelay  = delay + "s";

        document.body.appendChild(c);
        setTimeout(() => c.remove(), 2600);
      }
    }

    const btnConfirm = document.getElementById("btnConfirm");
    btnConfirm.addEventListener("click", function () {
      lanzarConfeti();
      setTimeout(() => {
        window.open("evento.html", "_blank", "noopener");
      }, 400);
    });
  </script>
</body>
</html>
