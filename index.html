<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitación de Cumpleaños - Rebeca</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: #4b1640;
      overflow: hidden;
      position: relative;
      background: #ffeaf4; /* ROSADO CLARO DE FONDO */
    }

    /* Fondo simple (con la siguiente foto, sin animaciones raras) */
    .bg-dynamic {
      position: fixed;
      inset: 0;
      z-index: -3;
      background-size: cover;
      background-position: center;
      filter: blur(14px) brightness(0.9);
      opacity: 0.55;
      transition: background-image 0.8s ease-out;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: radial-gradient(
        circle at top,
        rgba(255,255,255,0.7),
        rgba(255,192,224,0.5)
      );
    }

    /* Globos rosados que suben */
    .balloon {
      position: fixed;
      bottom: -120px;
      width: 36px;
      height: 48px;
      border-radius: 50% 50% 45% 45%;
      background: radial-gradient(circle at 30% 20%, #fff, #ff7bbf);
      box-shadow: 0 10px 22px rgba(0,0,0,0.25);
      animation: floatUp 10s linear infinite;
      z-index: -1;
    }
    .balloon::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 40px;
      background: rgba(255,255,255,0.85);
      left: 50%;
      top: 48px;
      transform: translateX(-50%);
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) translateX(0);   opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-120vh) translateX(25px); opacity: 0; }
    }

    /* Escena 3D para la tarjeta */
    .scene {
      perspective: 1100px;
      width: 100%;
      max-width: 420px;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .scene-hidden {
      opacity: 0;
      transform: translateY(20px) scale(0.96);
      pointer-events: none;
    }

    /* Contenedor para flotarla */
    .card-shell {
      position: relative;
      width: 100%;
      animation: cardFloat 10s ease-in-out infinite alternate;
    }
    @keyframes cardFloat {
      0%   { transform: rotateY(-6deg) rotateX(4deg) translateY(0); }
      50%  { transform: rotateY(6deg)  rotateX(-3deg) translateY(-6px); }
      100% { transform: rotateY(0deg)  rotateX(2deg)  translateY(0); }
    }

    /* Tarjeta frontal */
    .card-front {
      position: relative;
      padding: 22px 18px 26px;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.25);
      border: 1px solid rgba(255,180,220,0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: #4b1640;
      background: linear-gradient(135deg, #ffffff, #ffe0f3);
    }

    /* Bloque con la info del evento */
    .info-block {
      margin-bottom: 14px;
      font-size: 0.95rem;
      line-height: 1.4;
      color: #5b244a;
    }
    .info-block strong {
      color: #c21888;
    }

    /* Marco decorativo sencillo */
    .photo-frame {
      margin: 0 auto 16px;
      padding: 8px;
      border-radius: 22px;
      display: inline-block;
      position: relative;
      background: linear-gradient(135deg,#ff9ad5,#ffe3fb);
      box-shadow: 0 0 18px rgba(255,154,213,0.6);
    }
    .photo-frame::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 26px;
      border: 2px dashed rgba(255,130,190,0.7);
      pointer-events: none;
    }

    #fotoCumple {
      border-radius: 18px;
      border: 3px solid rgba(255,255,255,0.95);
      box-shadow: 0 10px 22px rgba(0,0,0,0.35);
      width: auto;
      height: auto;
      max-width: min(100%, 340px);
      max-height: 45vh;
      object-fit: contain;
      background: #0003;
      /* sin animaciones de zoom ni opacidad */
    }

    .btn-confirm {
      margin-top: 12px;
      width: 100%;
      max-width: 260px;
      padding: 12px 20px;
      border-radius: 999px;
      background: linear-gradient(135deg,#ffe0f3,#ff72c4);
      color: #3b1636;
      font-weight: 700;
      cursor: pointer;
      border: none;
      box-shadow: 0 12px 26px rgba(0,0,0,0.25);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(1);   box-shadow: 0 12px 26px rgba(0,0,0,0.25); }
      50%  { transform: scale(1.03); box-shadow: 0 14px 28px rgba(255,190,230,0.7); }
      100% { transform: scale(1);   box-shadow: 0 12px 26px rgba(0,0,0,0.25); }
    }

    /* Intro: sobre sencillo rosado */
    .intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255,234,244,0.9);
      cursor: pointer;
      transition: opacity 0.6s ease;
    }
    .intro-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .envelope-simple {
      width: 220px;
      height: 150px;
      background: #ffe9f7;
      border: 3px solid #f3b8de;
      border-radius: 10px;
      position: relative;
      box-shadow: 0 14px 28px rgba(0,0,0,0.25);
    }
    .envelope-simple::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 60%;
      background: #ffbddf;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-bottom: 1px solid rgba(210,120,170,0.7);
    }

    .intro-text {
      margin-top: 18px;
      font-size: 1.1rem;
      color: #c21888;
      text-align: center;
    }

    audio { display: none; }

    .confetti-piece {
      position: fixed;
      width: 8px;
      height: 14px;
      background: red;
      top: -20px;
      opacity: 0;
      z-index: 9999;
      animation: confettiFall 2.4s linear forwards;
    }
    @keyframes confettiFall {
      0%   { opacity: 1; transform: translateY(0) rotateZ(0deg); }
      100% { opacity: 0; transform: translateY(120vh) rotateZ(360deg); }
    }

    @media (max-width: 480px) {
      .info-block { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <!-- Fondo dinámico + overlay -->
  <div class="bg-dynamic" id="bgDynamic"></div>
  <div class="bg-overlay"></div>

  <!-- Pantalla inicial con sobre rosado -->
  <div id="intro" class="intro-overlay">
    <div class="envelope-simple"></div>
    <p class="intro-text">Abre para más información 😉</p>
  </div>

  <!-- Tarjeta principal -->
  <div id="scene" class="scene scene-hidden">
    <div class="card-shell">
      <div class="card-front">
        <!-- Texto principal del evento -->
        <div class="info-block">
          <p><strong>¡Estás invitado a celebrar los 25 años de Rebeca!</strong></p>
          <p>Fecha: 14 de diciembre.</p>
          <p>Lugar: Salón Estrada, 8 ave. 1-72 zona 1, San Miguel Petapa.</p>
          <p>Dará inicio a las 4 de la tarde.</p>
          <p><strong>¡No puedes faltar!</strong></p>
        </div>

        <div id="photoFrame" class="photo-frame">
          <img id="fotoCumple" src="foto1.jpg" alt="Foto de Rebeca" />
        </div>

        <button class="btn-confirm">Confirmar asistencia</button>
      </div>
    </div>
  </div>

  <!-- Música -->
  <audio id="music" src="musica.mp3" autoplay loop></audio>

  <script>
    // Globos rosados
    function crearGlobos() {
      for (let i = 0; i < 14; i++) {
        const b = document.createElement("div");
        b.classList.add("balloon");
        const delay = Math.random() * 7;
        const left  = Math.random() * 100;
        const hue   = 320 + Math.random() * 40; // tonos rosados/morados
        b.style.left = left + "vw";
        b.style.animationDelay = delay + "s";
        b.style.background =
          "radial-gradient(circle at 30% 20%, #fff, hsl(" +
          hue +
          ", 80%, 65%))";
        document.body.appendChild(b);
      }
    }
    crearGlobos();

    // Intro: sobre -> muestra invitación
    const intro = document.getElementById("intro");
    const scene = document.getElementById("scene");
    const music = document.getElementById("music");

    function abrirInvitacion() {
      if (music && music.paused) {
        music.play().catch(()=>{});
      }
      intro.classList.add("intro-hidden");
      setTimeout(() => {
        scene.classList.remove("scene-hidden");
      }, 400);
    }
    intro.addEventListener("click", abrirInvitacion);

    // Carrusel de fotos: automático + swipe táctil
    const fotos = [
      "foto1.jpg","foto2.jpg","foto3.jpg","foto4.jpg","foto5.jpg",
      "foto6.jpg","foto7.jpg","foto8.jpg","foto9.jpg","foto10.jpg"
    ];
    const foto  = document.getElementById("fotoCumple");
    const bg    = document.getElementById("bgDynamic");
    const zonaDesliz = document.getElementById("photoFrame");
    let indice  = 0;
    let carruselInterval = null;

    function mostrarFotoActual() {
      const actual    = fotos[indice];
      const siguiente = fotos[(indice + 1) % fotos.length];

      const nuevaImg = new Image();
      nuevaImg.src = actual;

      nuevaImg.onload = function () {
        const maxAncho = Math.min(window.innerWidth * 0.9, 340);
        const maxAlto  = window.innerHeight * 0.45;

        let ancho = nuevaImg.width;
        let alto  = nuevaImg.height;

        const ratio = Math.min(maxAncho / ancho, maxAlto / alto, 1);
        ancho *= ratio;
        alto  *= ratio;

        foto.style.width  = ancho + "px";
        foto.style.height = alto + "px";
        foto.src = actual;
      };

      // Fondo difuminado de la página con la siguiente foto
      bg.style.backgroundImage =
        "linear-gradient(135deg, rgba(255,200,230,0.8), rgba(255,234,244,0.9)), url('" +
        siguiente +
        "')";
    }

    function cambiarFoto(direccion = 1) {
      indice = (indice + direccion + fotos.length) % fotos.length;
      mostrarFotoActual();
    }

    function iniciarCarrusel() {
      if (carruselInterval) clearInterval(carruselInterval);
      carruselInterval = setInterval(() => cambiarFoto(1), 6000); // 6 segundos
    }

    // Controles táctiles (swipe)
    let touchStartX = 0;
    let touchEndX = 0;

    function manejarSwipe() {
      const diffX = touchEndX - touchStartX;
      const umbral = 50; // píxeles mínimos para considerar swipe

      if (Math.abs(diffX) > umbral) {
        // detener y reiniciar el carrusel al interactuar
        if (carruselInterval) clearInterval(carruselInterval);

        if (diffX < 0) {
          // swipe hacia la izquierda -> siguiente foto
          cambiarFoto(1);
        } else {
          // swipe hacia la derecha -> foto anterior
          cambiarFoto(-1);
        }

        iniciarCarrusel();
      }
    }

    zonaDesliz.addEventListener("touchstart", (e) => {
      if (e.touches && e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
      }
    }, { passive: true });

    zonaDesliz.addEventListener("touchend", (e) => {
      if (e.changedTouches && e.changedTouches.length > 0) {
        touchEndX = e.changedTouches[0].clientX;
        manejarSwipe();
      }
    }, { passive: true });

    // Inicializar carrusel
    mostrarFotoActual();
    iniciarCarrusel();

    // Confeti + abrir evento.html
    function lanzarConfeti() {
      const colores = ["#ff76c7","#ffe0f5","#ffb3df","#fdd5ff","#ffffff"];
      const cantidad = 160;
      for (let i = 0; i < cantidad; i++) {
        const c = document.createElement("div");
        c.classList.add("confetti-piece");
        const size  = 6 + Math.random() * 6;
        const left  = Math.random() * 100;
        const delay = Math.random() * 0.8;
        const color = colores[Math.floor(Math.random() * colores.length)];
        c.style.width           = size + "px";
        c.style.height          = size * 1.5 + "px";
        c.style.left            = left + "vw";
        c.style.background      = color;
        c.style.animationDelay  = delay + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 2600);
      }
    }

    document.querySelectorAll(".btn-confirm").forEach(btn => {
      btn.addEventListener("click", () => {
        lanzarConfeti();
        setTimeout(() => {
          window.open("evento.html", "_blank", "noopener");
        }, 400);
      });
    });
  </script>
</body>
</html>
